<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litecor</title>
<style>
/* CUSTOM FONTS */
@font-face { font-family: 'PPEditorial'; src: url('PPEditorialNew-Regular.otf') format('opentype'); font-weight: normal; font-style: normal; }
@font-face { font-family: 'PPEditorialBold'; src: url('PPEditorialNew-Ultrabold.otf') format('opentype'); font-weight: 800; font-style: normal; }
@font-face { font-family: 'PPNeueCorp'; src: url('PPNeueCorp-CondensedUltrabold.otf') format('opentype'); font-weight: 800; font-style: normal; }

:root{ 
    --bg1:#060912; --bg2:#0b1d2f; 
    --accent:#6cf3ff; --accent2:#8a5cff; 
    --muted:rgba(235,245,255,.6); 
    --glow1: rgba(108, 243, 253, 0.12);
    --glow2: rgba(138, 92, 255, 0.12);
    --pulse: 1;
}

body.glitch-mode { --accent: #00ff9d; --accent2: #0084ff; --glow1: rgba(0, 255, 157, 0.25); --glow2: rgba(0, 132, 255, 0.25); filter: contrast(1.1) brightness(1.1); }
body.bass-boost { animation: bass-vibe 0.1s infinite; }
@keyframes bass-vibe { 0% { transform: translate(1px, 1px); } 25% { transform: translate(-1px, -1px); } 50% { transform: translate(-2px, 1px); } 75% { transform: translate(1px, -1px); } 100% { transform: translate(0, 0); } }

*{box-sizing:border-box; -webkit-font-smoothing: antialiased;}
html,body{ margin:0; font-family:'PPEditorial', serif; color:#ecf7ff; background:var(--bg1); overflow-x:hidden; min-height:100vh; }

/* TITLES / HERO INTRO / LOADER: PP NEUE CORP */
h1, h2, h3, .loader-text, .panel h2, #typed { 
    font-family: 'PPNeueCorp', sans-serif !important; 
    font-weight: 800 !important;
    text-transform: uppercase;
    letter-spacing: -0.02em;
}

/* LOGO / TRACK NAME / DISCORD NAMES / BUTTONS: CLEAN DEFAULT FONT */
.logo span, .track-name, .discord-name, .nav-center a, .contact-btn-vibrant {
    font-family: Arial, Helvetica, sans-serif !important;
    font-weight: 900 !important;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* BUTTONS EFFECTS */
.nav-center a, .contact-btn-vibrant {
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: inline-block;
    border: none;
    cursor: pointer;
    text-decoration: none;
}
.contact-btn-vibrant {
    background: linear-gradient(120deg, var(--accent), var(--accent2));
    color: #021018;
    padding: 16px 45px;
    border-radius: 999px;
    box-shadow: 0 10px 20px rgba(108, 243, 253, 0.15);
}
.contact-btn-vibrant.secondary {
    background: rgba(255,255,255,0.05);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.1);
}
.contact-btn-vibrant:hover {
    transform: scale(1.08) translateY(-3px) !important;
    box-shadow: 0 15px 30px rgba(108, 243, 253, 0.3);
}

/* BIGGER LOADER FONT */
#loader { position: fixed; inset: 0; background: #060912; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: 0.8s cubic-bezier(0.85, 0, 0.15, 1); }
#loader.hide { opacity: 0; pointer-events: none; }
.loader-text { font-size: clamp(32px, 6vw, 64px); letter-spacing: 10px; color: var(--accent); text-align: center; }

.bg{ position:fixed; inset:-15%; background: radial-gradient(circle at 20% 30%, var(--glow1), transparent 40%), radial-gradient(circle at 75% 65%, var(--glow2), transparent 45%); filter:blur(70px); z-index:0; pointer-events: none; transition: 2.5s ease-in-out; transform: scale(var(--pulse)); will-change: transform; }

header{ position:fixed; top:0; left:0; right:0; height: 65px; display:flex; justify-content:center; align-items: center; z-index:300; background: rgba(6, 9, 18, 0.4); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); }
.nav{ width:min(1200px,96%); display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; }
.logo{ display:flex; align-items:center; gap:10px; cursor:pointer; justify-self: start; }
.logo video{ width:42px; height:42px; border-radius:10px; }
.logo span{ font-size: 16px; animation:logoShift 10s linear infinite; }
@keyframes logoShift{ 0%, 100% {color:var(--accent)} 50% {color:var(--accent2)} }

.nav-center{ display:flex; gap:8px; justify-self: center; }
.nav-center a{ font-size: 10px; padding:7px 18px; border-radius:999px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); color:#fff; }
.nav-center a:hover{ border-color: var(--accent); transform:translateY(-1px); }

.header-right{ justify-self: end; display: flex !important; align-items: center !important; gap: 15px; }
.liteify{ position:relative; }
.liteify-toggle{ display: flex; align-items: center; gap: 8px; padding:7px 20px; border-radius:999px; cursor:pointer; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12); backdrop-filter:blur(12px); font-size:12px; font-weight:800; color:#fff; transition: 0.3s; }

.liteify-panel{ position:absolute; top:55px; right:-10px; width:320px; padding:35px; border-radius:26px; background:rgba(8,12,22,.98); backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,.1); box-shadow:0 40px 100px rgba(0,0,0,0.8); opacity:0; transform:translateY(-10px) scale(.95); pointer-events:none; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; overflow: hidden; }
.liteify-panel.open{ opacity:1; transform:none; pointer-events:auto; }

.track-name{ display: block; text-align:center; color:var(--accent); margin-top: -25px; margin-bottom:25px; font-size: 21px; width:100%; position: relative; z-index: 2; }

.speaker-wave { width: 3px; background: var(--accent); border-radius: 10px; height: 4px; transition: 0.1s ease-out; }
.vol-slider{ -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; flex-grow: 1; }
.vol-slider::-webkit-slider-thumb{ -webkit-appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; cursor: pointer; }

main{ position:relative; z-index:10; transition: opacity 0.3s ease; padding-top: 65px; }
.container { width: min(1200px, 94%); margin: 0 auto; text-align: center; }

/* PANELS FIXED WIDTH SYNC */
.card-grid-2 { display: flex !important; justify-content: center; gap: 25px; width: 100%; max-width: 1000px; margin: 0 auto; flex-wrap: nowrap; }
.card-grid-2 > div, .card-grid-2 > a { flex: 1; width: 100%; }
.panel{ background: rgba(255,255,255,0.025); border-radius: 28px; border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(15px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative; overflow: hidden; }
.panel:hover{ border-color: var(--accent); transform: translateY(-8px); background: rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

.trail{ position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:999; }
.dot{ position:absolute; width:6px; height:6px; background:var(--accent); border-radius:50%; pointer-events: none; transform: translate(-50%, -50%); will-change: transform; }
.dot.cheeku-mode { background: transparent; color: #fff; font-size: 22px; font-weight: 800; width: auto; height: auto; text-shadow: 0 0 10px var(--accent); font-family: Arial, sans-serif; }

.cursor{ display: inline-block; width: 10px; height: 1.1em; background: var(--accent); margin-left: 5px; vertical-align: middle; animation: blink 1s steps(1) infinite; }

.scroll-hint{ display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; opacity: 0.7; transition: 0.3s; position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 2; }
.arrow{ width: 18px; height: 18px; border-left: 3px solid var(--accent); border-bottom: 3px solid var(--accent); transform: rotate(-45deg); animation: bounce 2s infinite; }

@keyframes bounce{ 0%,100%{transform:translateY(0) rotate(-45deg)} 50%{transform:translateY(10px) rotate(-45deg)} }
@keyframes blink{ 50%{opacity:0} }

.confetti { position: fixed; width: 10px; height: 10px; bottom: -20px; z-index: 998; pointer-events: none; }
@keyframes celebration-burst { 0% { transform: translate(0, 0) rotateX(0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) rotateX(720deg); opacity: 0; } }

#copy-toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #000; padding: 12px 28px; border-radius: 999px; font-weight: 800; font-size: 13px; z-index: 1000; opacity: 0; transition: 0.4s; }
#copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

#samples { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 30px !important; margin-top: 40px; padding-bottom: 150px; width: 100%; }
iframe { width:100%; height:450px; border-radius:28px; border:none; background:rgba(0,0,0,0.2); }
</style>
</head>
<body>
<div id="loader"><div class="loader-text">SYSTEM INITIALIZING...</div></div>
<div class="bg" id="bg"></div>
<div id="copy-toast">ID Copied!</div>

<header>
  <div class="nav">
    <div class="logo" id="logo-trigger">
      <video src="LitecorLogo.mp4" autoplay muted loop playsinline></video>
      <span>LITECOR</span>
    </div>
    <div class="nav-center" id="dynamic-nav"></div>
    <div class="header-right">
      <div class="liteify">
        <div class="liteify-toggle" id="lt" style="display: flex; align-items: center; gap: 7px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            Liteify
        </div>
        <div class="liteify-panel" id="lp">
          <video src="Liteify_Bg.mp4" autoplay muted loop playsinline style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1); width: 100%; height: 100%; object-fit: contain; z-index: 1; opacity: 0.15; pointer-events: none;"></video>
          <span id="tn" class="track-name">Track Name</span>
          <div style="display:flex; justify-content:center; align-items:center; gap:22px; margin-bottom:20px; position: relative; z-index: 2;">
            <button id="prev" style="background:none; border:none; cursor:pointer; color:#fff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button id="play" style="width:48px; height:48px; border-radius:50%; background:var(--accent); border:none; display:flex; align-items:center; justify-content:center; color:#000;"><svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
            <button id="next" style="background:none; border:none; cursor:pointer; color:#fff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/></svg></button>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:12px; font-family:monospace; position: relative; z-index: 2;"><span id="curT">0:00</span><span id="durT">0:00</span></div>
          <div style="display: flex; align-items: center; gap: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); position: relative; z-index: 2;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent)" style="flex-shrink:0;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <div id="bass-trigger" style="display: flex; align-items: center; gap: 3px; height: 20px; cursor: pointer;">
                <div class="speaker-wave"></div><div class="speaker-wave"></div><div class="speaker-wave"></div><div class="speaker-wave"></div><div class="speaker-wave"></div>
            </div>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.35" class="vol-slider">
          </div>
        </div>
      </div>
      <img id="dance-gif" src="dance.gif" style="height: 38px; border-radius: 8px; opacity: 0; transition: 0.4s;">
    </div>
  </div>
</header>

<main id="content-area"></main>
<audio id="audio"></audio>
<div class="trail" id="trail"></div>

<script>
let mx=0, my=0; document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
window.addEventListener('load', () => { setTimeout(() => { document.getElementById('loader').classList.add('hide'); }, 1500); });
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq = 800) {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}
function launchConfetti() {
    playSound(400); const colors = ['#6cf3ff', '#8a5cff', '#ffffff'];
    for (let i = 0; i < 75; i++) {
        const c = document.createElement('div'); c.className = 'confetti';
        const isLeft = Math.random() > 0.5; c.style.left = isLeft ? '-10px' : 'calc(100% + 10px)';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        const size = Math.random() * 8 + 6; c.style.width = size + 'px'; c.style.height = (size * 0.6) + 'px';
        const xDist = isLeft ? (Math.random() * 50 + 20) : -(Math.random() * 50 + 20);
        c.style.setProperty('--x', xDist + 'vw'); c.style.setProperty('--y', -(Math.random() * 80 + 40) + 'vh');
        c.style.animation = `celebration-burst ${Math.random() * 1.5 + 2}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
        document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
    }
}
async function navigateTo(url, type) {
  const content = document.getElementById('content-area'); content.style.opacity = '0';
  setTimeout(async () => {
    const response = await fetch(url); content.innerHTML = await response.text(); content.style.opacity = '1';
    window.scrollTo({ top: 0 }); const navEl = document.getElementById('dynamic-nav');
    if(type === 'index') navEl.innerHTML = `<a href="#" onclick="navigateTo('editing-content.html', 'editing')">Editing</a><a href="#" onclick="navigateTo('discord-content.html', 'discord')">Discord</a>`;
    else if(type === 'editing') navEl.innerHTML = `<a href="#" onclick="navigateTo('home-content.html', 'index')">Home</a><a href="#" onclick="navigateTo('discord-content.html', 'discord')">Discord</a>`;
    else if(type === 'discord') navEl.innerHTML = `<a href="#" onclick="navigateTo('home-content.html', 'index')">Home</a><a href="#" onclick="navigateTo('editing-content.html', 'editing')">Editing</a>`;
    else navEl.innerHTML = `<a href="#" onclick="navigateTo('home-content.html', 'index')">Home</a>`;
    if(type === 'index') { charIdx=0; typeAnim(); applyTilt('editZone'); applyTilt('discZone'); }
  }, 350);
}
const playlist = [
  {n:"New Magic Wand", f:"Tyler, The Creator - NEW MAGIC WAND (feat. Santigold & Jessy Wilson).mp3", c1:"rgba(255,108,108,0.15)", c2:"rgba(6,9,18,0.5)", a:"#ff6c6c"},
  {n:"Sicko Mode", f:"Travis Scott - SICKO MODE ft. Drake.mp3", c1:"rgba(108,243,255,0.15)", c2:"rgba(138,92,255,0.15)", a:"#6cf3ff"},
  {n:"See You Again", f:"Tyler, The Creator - See You Again (Audio) ft. Kali Uchis.mp3", c1:"rgba(255,180,108,0.15)", c2:"rgba(255,255,108,0.15)", a:"#ffb46c"},
  {n:"Starboy", f:"The Weeknd - Starboy (Lyrics) ft. Daft Punk.mp3", c1:"rgba(138,92,255,0.15)", c2:"rgba(6,9,18,0.5)", a:"#8a5cff"},
  {n:"Timeless", f:"The Weeknd, Playboi Carti - Timeless (Lyrics).mp3", c1:"rgba(108,243,255,0.15)", c2:"rgba(138,92,255,0.15)", a:"#6cf3ff"},
  {n:"Monëy so big", f:"Monëy so big.mp3", c1:"rgba(108,255,150,0.15)", c2:"rgba(138,92,255,0.15)", a:"#6cff96"}
];
let trackIdx = Math.floor(Math.random() * playlist.length);
const audio = document.getElementById('audio'), playBtn = document.getElementById('play'), pIcon = document.getElementById('playIcon'), vol = document.getElementById('vol'), tn = document.getElementById('tn'), danceGif = document.getElementById('dance-gif');
function loadTrack(idx) {
  const t = playlist[idx]; audio.src = t.f; tn.textContent = t.n;
  document.documentElement.style.setProperty('--glow1', t.c1); document.documentElement.style.setProperty('--glow2', t.c2); document.documentElement.style.setProperty('--accent', t.a);
}
audio.volume = 0.35; loadTrack(trackIdx);
playBtn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); };
audio.onplay = () => { pIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; danceGif.style.opacity = "1"; };
audio.onpause = () => { pIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; danceGif.style.opacity = "0"; };
audio.onended = () => { trackIdx = (trackIdx + 1) % playlist.length; loadTrack(trackIdx); audio.play(); };
function animateAudio() {
    if (!audio.paused) {
        const v = audio.volume; document.documentElement.style.setProperty('--pulse', 1 + (Math.sin(Date.now() * 0.005) * 0.03 * v));
        document.querySelectorAll('.speaker-wave').forEach(bar => { bar.style.height = (4 + Math.random() * 16 * v) + 'px'; });
    } else { document.querySelectorAll('.speaker-wave').forEach(bar => bar.style.height = '4px'); }
    requestAnimationFrame(animateAudio);
}
animateAudio();
vol.oninput = () => { audio.volume = vol.value; };
function fmtTime(s) { if(!s || isNaN(s)) return "0:00"; let m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }
audio.onloadedmetadata = () => document.getElementById('durT').textContent = fmtTime(audio.duration);
audio.ontimeupdate = () => document.getElementById('curT').textContent = fmtTime(audio.currentTime);
document.getElementById('next').onclick = () => { trackIdx = (trackIdx + 1) % playlist.length; loadTrack(trackIdx); audio.play(); };
document.getElementById('prev').onclick = () => { trackIdx = (trackIdx - 1 + playlist.length) % playlist.length; loadTrack(trackIdx); audio.play(); };
let inputBuffer = "", cheekuMode = false, logoClicks = 0;
document.getElementById('logo-trigger').onclick = () => {
    logoClicks++; if(logoClicks === 5) { document.body.classList.toggle('glitch-mode'); logoClicks = 0; } 
    else { navigateTo('home-content.html', 'index'); }
};
document.getElementById('bass-trigger').ondblclick = () => { document.body.classList.toggle('bass-boost'); playSound(100); };
document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(); if(k === 'j') document.getElementById('prev').click(); if(k === 'k') playBtn.click(); if(k === 'l') document.getElementById('next').click();
    inputBuffer += e.key.toUpperCase();
    if(inputBuffer.includes("CHEEKU")) { cheekuMode = true; launchConfetti(); inputBuffer = ""; setTimeout(() => cheekuMode = false, 12000); }
    if(inputBuffer.includes("LITECOR")) { launchConfetti(); inputBuffer = ""; }
    if(inputBuffer.length > 8) inputBuffer = inputBuffer.substring(1);
});
const dots = []; const cheekuChars = "CHEEKU";
for(let i=0; i<6; i++) { const d = document.createElement('div'); d.className = 'dot'; document.getElementById('trail').appendChild(d); dots.push({el: d, x: 0, y: 0}); }
function render() {
    let x = mx, y = my;
    dots.forEach((p, i) => { 
        p.x += (x - p.x) * (0.25 - i*0.03); p.y += (y - p.y) * (0.25 - i*0.03);
        p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0)`; 
        if(cheekuMode) { p.el.className = 'dot cheeku-mode'; p.el.textContent = cheekuChars[i]; }
        else { p.el.className = 'dot'; p.el.textContent = ''; p.el.style.background = ''; }
        x = p.x; y = p.y; 
    });
    requestAnimationFrame(render);
}
render();
function copyID(id) {
    navigator.clipboard.writeText(id); const toast = document.getElementById('copy-toast');
    toast.textContent = "ID Copied: " + id; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2000);
}
const lt = document.getElementById('lt'), lp = document.getElementById('lp');
lt.onclick = e => { e.stopPropagation(); lp.classList.toggle('open'); };
document.onclick = e => { if(!lp.contains(e.target)) lp.classList.remove('open'); };
let charIdx = 0;
function typeAnim() {
  const t = "Hey, I’m Litecor, video editor and clipper"; const el = document.getElementById('typed');
  if(el && charIdx <= t.length) { el.textContent = t.slice(0, charIdx++); setTimeout(typeAnim, 60); }
}
function applyTilt(id) {
    const z = document.getElementById(id); if(!z) return;
    z.onmousemove = e => {
        const r = z.getBoundingClientRect(); const x = (e.clientX - r.left)/r.width - 0.5, y = (e.clientY - r.top)/r.height - 0.5;
        z.style.transform = `rotateX(${-y*15}deg) rotateY(${x*20}deg) scale3d(1.02, 1.02, 1.02)`;
    };
    z.onmouseleave = () => z.style.transform = '';
}
window.onload = () => navigateTo('home-content.html', 'index');
</script>
</body>
</html>
